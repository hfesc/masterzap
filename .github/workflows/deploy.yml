name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-to-heroku:
    name: Heroku Deploy & Smoke Test
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout approved commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Normalize Heroku credential
        id: heroku-credential
        env:
          HEROKU_CREDENTIAL: ${{ secrets.HEROKU_API_KEY }}
        run: |
          if HEROKU_TOKEN=$(printf '%s' "$HEROKU_CREDENTIAL" | jq -er '.access_token // .token // empty' 2>/dev/null); then
            :
          else
            HEROKU_TOKEN="$HEROKU_CREDENTIAL"
          fi
          if [ -z "$HEROKU_TOKEN" ] || printf '%s' "$HEROKU_TOKEN" | grep -q '[[:space:]]'; then
            echo "HEROKU_API_KEY must be a bare token or Heroku authorization JSON." >&2
            exit 1
          fi
          echo "::add-mask::$HEROKU_TOKEN"
          echo "token=$HEROKU_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Capture Previous Release Version
        id: pre-deploy
        env:
          HEROKU_API_KEY: ${{ steps.heroku-credential.outputs.token }}
        run: |
          PREV_RELEASE=$(heroku releases -a ${{ secrets.HEROKU_APP_NAME }} --json | jq -r '.[0].version // empty')
          echo "previous_release=$PREV_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Captured previous release: v$PREV_RELEASE"

      - name: Push approved commit to Heroku
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          HEROKU_TOKEN: ${{ steps.heroku-credential.outputs.token }}
        run: |
          git remote add heroku "https://heroku:${HEROKU_TOKEN}@git.heroku.com/${{ secrets.HEROKU_APP_NAME }}.git"
          git push heroku "$DEPLOY_SHA":refs/heads/main

      - name: Verify Approved Commit Is Active
        id: verify-deploy
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          HEROKU_API_KEY: ${{ steps.heroku-credential.outputs.token }}
        run: |
          RELEASES=$(heroku releases -a ${{ secrets.HEROKU_APP_NAME }} --json)
          NEW_RELEASE=$(printf '%s' "$RELEASES" | jq -r '.[0].version')
          ACTUAL_COMMIT=$(printf '%s' "$RELEASES" | jq -r '.[0].description // empty' | grep -oE '[0-9a-f]{8,40}' | tail -1)
          if [[ "$EXPECTED_COMMIT" != "$ACTUAL_COMMIT"* ]]; then
            echo "Active Heroku release v$NEW_RELEASE does not contain the approved commit." >&2
            exit 1
          fi
          echo "new_release=$NEW_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Verified approved commit in active release v$NEW_RELEASE"

      - name: Wait for Dynos to Restart
        run: sleep 15

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22.x

      - name: Smoke Test (Healthz, Redirect and Zero Telemetry)
        id: smoke-test
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          node scripts/deployment-smoke.mjs "$APP_URL"

      - name: Automatic Rollback on Failure
        if: failure()
        env:
          HEROKU_API_KEY: ${{ steps.heroku-credential.outputs.token }}
        run: |
          PREV_RELEASE="${{ steps.pre-deploy.outputs.previous_release }}"
          if [ -n "$PREV_RELEASE" ] && [ "$PREV_RELEASE" != "null" ]; then
            echo "Smoke test or deploy failed! Initiating rollback to v$PREV_RELEASE..."
            heroku rollback v$PREV_RELEASE -a ${{ secrets.HEROKU_APP_NAME }}
          else
            echo "No previous release captured. Cannot rollback."
          fi
