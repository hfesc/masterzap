name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-to-heroku:
    name: Heroku Deploy & Smoke Test
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Capture Previous Release Version
        id: pre-deploy
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          PREV_RELEASE=$(heroku releases -a ${{ secrets.HEROKU_APP_NAME }} --json | jq -r '.[0].version // empty' || true)
          echo "previous_release=$PREV_RELEASE" >> $GITHUB_OUTPUT
          echo "Captured previous release: v$PREV_RELEASE"

      - name: Push to Heroku Git Remote
        run: |
          git remote add heroku https://heroku:${{ secrets.HEROKU_API_KEY }}@git.heroku.com/${{ secrets.HEROKU_APP_NAME }}.git
          git push heroku ${{ github.sha }}:refs/heads/main --force

      - name: Verify New Release
        id: verify-deploy
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          NEW_RELEASE=$(heroku releases -a ${{ secrets.HEROKU_APP_NAME }} --json | jq -r '.[0].version')
          echo "new_release=$NEW_RELEASE" >> $GITHUB_OUTPUT
          echo "Deployed new release: v$NEW_RELEASE"

      - name: Wait for Dynos to Restart
        run: sleep 15

      - name: Smoke Test (Healthz and Redirect)
        id: smoke-test
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          echo "Testing $APP_URL/healthz..."
          HEALTH=$(curl -s --write-out "%{http_code}" -o temp_health_res.json $APP_URL/healthz)
          if [ "$HEALTH" -ne 200 ]; then
            echo "Healthz check failed with status $HEALTH"
            cat temp_health_res.json
            exit 1
          fi

          if ! grep -q '"status":"ok"' temp_health_res.json; then
            echo "Healthz payload invalid."
            cat temp_health_res.json
            exit 1
          fi

          echo "Testing $APP_URL/ authentication redirect..."
          FINAL_URL=$(curl -s -L -I -o /dev/null -w "%{url_effective}" $APP_URL/)

          if [[ "$FINAL_URL" != *"accounts.google.com"* && "$FINAL_URL" != *"google.com"* ]]; then
             echo "Expected redirect to Google OAuth, got $FINAL_URL"
             ROOT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -I $APP_URL/)
             if [[ "$ROOT_STATUS" == "5"* ]]; then
               echo "Site returned 5xx error."
               exit 1
             fi
          fi

          echo "Smoke test passed successfully."

      - name: Automatic Rollback on Failure
        if: failure()
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          PREV_RELEASE="${{ steps.pre-deploy.outputs.previous_release }}"
          if [ -n "$PREV_RELEASE" ] && [ "$PREV_RELEASE" != "null" ]; then
            echo "Smoke test or deploy failed! Initiating rollback to v$PREV_RELEASE..."
            heroku rollback v$PREV_RELEASE -a ${{ secrets.HEROKU_APP_NAME }}
          else
            echo "No previous release captured. Cannot rollback."
          fi
